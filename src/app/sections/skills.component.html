<section id="skills" class="sm:py-36 relative" aria-labelledby="skills-title">
  <div class="max-w-7xl mx-auto px-6">
    <!-- Section Header -->
    <div scrollAnimate class="text-center mb-16">
      <h2 scrollAnimate id="projects-title" class="flex items-center text-sm font-bold uppercase tracking-widest text-slate-900 dark:text-slate-custom-lightest mb-10 lg:sr-only">
        <span class="section-number">04.</span>
        {{ t().skills.title }}
        <span class="ml-4 h-px flex-1 bg-slate-300 dark:bg-navy-lighter"></span>
      </h2>
      <p class="text-zinc-500 dark:text-zinc-400 max-w-2xl mx-auto text-lg">
        {{ t().skills.subtitle }}
      </p>
    </div>

    <!-- Skills Bento Grid -->
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
      @for (category of t().skills.categories; track category.name; let i = $index) {
        <div scrollAnimate [delay]="i * 80" class="bento-card p-7 group" [class.sm:col-span-2]="i === 0" [class.lg:col-span-1]="i === 0">
          <!-- Category Name -->
          <h3 class="text-base font-bold text-zinc-900 dark:text-white mb-4">
            {{ category.name }}
          </h3>

          <!-- Skills Tags -->
          <div class="flex flex-wrap gap-2">
            @for (skill of category.items; track skill) {
              <span
                class="px-3 py-1.5 text-xs font-medium rounded-lg bg-zinc-50 dark:bg-zinc-800/50 text-zinc-600 dark:text-zinc-400 border border-zinc-100 dark:border-zinc-800/60 group-hover:bg-primary-50 dark:group-hover:bg-primary-500/5 group-hover:text-primary-700 dark:group-hover:text-primary-300 group-hover:border-primary-200/60 dark:group-hover:border-primary-500/15 transition-all duration-300">
                {{ skill }}
              </span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
