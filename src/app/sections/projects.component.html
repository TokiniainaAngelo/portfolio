<section id="projects" class="mb-24 scroll-mt-24" aria-labelledby="projects-title">
  <h2 scrollAnimate id="projects-title" class="flex items-center text-sm font-bold uppercase tracking-widest text-slate-900 dark:text-slate-custom-lightest mb-10 lg:sr-only">
    <span class="section-number">03.</span>
    {{ t().projects.title }}
    <span class="ml-4 h-px flex-1 bg-slate-300 dark:bg-navy-lighter"></span>
  </h2>

  <div class="space-y-2">
    @for (project of t().projects.items; track project.title; let i = $index) {
      <article scrollAnimate [delay]="i * 80" class="hover-card group">
        <!-- Subtitle / Context -->
        <p class="text-xs font-mono uppercase tracking-wider text-slate-400 dark:text-slate-custom-dark mb-2">
          {{ project.subtitle }}
        </p>

        <!-- Title -->
        <h3
          class="text-base font-medium text-slate-800 dark:text-slate-custom-lightest group-hover:text-teal-600 dark:group-hover:text-accent transition-colors mb-2 flex items-center gap-2">
          {{ project.title }}
          @if (project.featured) {
            <a
              href="{{ project.link }}"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex items-center justify-center text-teal-500 hover:text-teal-600 dark:text-accent transition-colors"
              aria-label="Voir le projet Planeo">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H18m0 0v4.5M18 6l-7.5 7.5M6 10.5V18a1.5 1.5 0 001.5 1.5H15a1.5 1.5 0 001.5-1.5v-3" />
              </svg>
            </a>
          }
        </h3>

        <!-- Description -->
        <p class="text-sm text-slate-600 dark:text-slate-custom leading-relaxed mb-4">
          {{ project.description }}
        </p>

        <!-- Tech Stack -->
        <div class="flex flex-wrap gap-2">
          @for (tech of project.tech; track tech) {
            <span class="tech-tag">{{ tech }}</span>
          }
        </div>
      </article>
    }
  </div>
</section>
